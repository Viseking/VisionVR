<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="700" y="50" text-anchor="middle" class="title">VisionVR Prototype Wiring Map</text>

  <rect x="90" y="120" width="240" height="220" rx="18" class="box"/>
  <text x="210" y="160" text-anchor="middle" class="section">VR Headset</text>
  <text x="210" y="195" text-anchor="middle" class="label">RGB Cam 1</text>
  <text x="210" y="225" text-anchor="middle" class="label">RGB Cam 2</text>
  <text x="210" y="255" text-anchor="middle" class="label">IR Eye Cam</text>
  <text x="210" y="285" text-anchor="middle" class="label">IMU + Buttons</text>
  <text x="210" y="315" text-anchor="middle" class="small">Mounted in front / side frame</text>

  <rect x="430" y="120" width="240" height="220" rx="18" class="box"/>
  <text x="550" y="160" text-anchor="middle" class="section">ESP32</text>
  <text x="550" y="195" text-anchor="middle" class="label">IMU polling</text>
  <text x="550" y="225" text-anchor="middle" class="label">Battery status</text>
  <text x="550" y="255" text-anchor="middle" class="label">Button / trigger input</text>
  <text x="550" y="285" text-anchor="middle" class="label">Telemetry output</text>

  <rect x="780" y="120" width="260" height="220" rx="18" class="box"/>
  <text x="910" y="160" text-anchor="middle" class="section">Raspberry Pi 5</text>
  <text x="910" y="195" text-anchor="middle" class="label">Camera capture</text>
  <text x="910" y="225" text-anchor="middle" class="label">Depth + SLAM</text>
  <text x="910" y="255" text-anchor="middle" class="label">Gesture logic</text>
  <text x="910" y="285" text-anchor="middle" class="label">Spatial UI generation</text>

  <rect x="495" y="470" width="300" height="210" rx="18" class="box"/>
  <text x="645" y="515" text-anchor="middle" class="section">Output / Overlay</text>
  <text x="645" y="550" text-anchor="middle" class="label">Focus + aim vector</text>
  <text x="645" y="580" text-anchor="middle" class="label">3D floating windows</text>
  <text x="645" y="610" text-anchor="middle" class="label">Room-anchored actions</text>
  <text x="645" y="640" text-anchor="middle" class="small">Display or HMD overlay</text>

  <path d="M330 230 L430 230" class="line"/>
  <text x="359" y="210" class="small">USB / CSI / I2C</text>

  <path d="M670 230 L780 230" class="line"/>
  <text x="705" y="210" class="small">UART / I2C / Wi-Fi</text>

  <path d="M910 340 L910 385 L645 385 L645 470" class="line"/>
  <text x="705" y="370" class="small">Output stream</text>

  <path d="M645 470 L645 360 L910 360" class="thin"/>
  <text x="650" y="350" class="small">feedback loop</text>

  <rect x="1000" y="470" width="265" height="200" rx="18" class="box"/>
  <text x="1132" y="515" text-anchor="middle" class="section">Power / Wiring</text>
  <text x="1132" y="550" text-anchor="middle" class="label">5V Pi power</text>
  <text x="1132" y="580" text-anchor="middle" class="label">3.3V ESP32 rail</text>
  <text x="1132" y="610" text-anchor="middle" class="label">Battery + regulator</text>
  <text x="1132" y="640" text-anchor="middle" class="small">Fuse + ground isolation</text>

  <path d="M1040 230 L1132 230 L1132 470" class="thin"/>
  <text x="1070" y="212" class="small">power routing</text>

</svg>
