<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px Arial, sans-serif; fill: #334155; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2; fill: none; }
      .node { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="600" y="52" text-anchor="middle" class="title">VisionVR System Overview</text>

  <rect x="60" y="110" width="230" height="180" rx="18" class="box"/>
  <text x="175" y="155" text-anchor="middle" class="label">VR Headset</text>
  <text x="175" y="190" text-anchor="middle" class="small">Display + optics</text>
  <text x="175" y="215" text-anchor="middle" class="small">RGB cameras</text>
  <text x="175" y="240" text-anchor="middle" class="small">IR eye camera</text>
  <text x="175" y="265" text-anchor="middle" class="small">IMU + buttons</text>

  <rect x="375" y="110" width="210" height="180" rx="18" class="box"/>
  <text x="480" y="155" text-anchor="middle" class="label">ESP32 Hub</text>
  <text x="480" y="190" text-anchor="middle" class="small">IMU polling</text>
  <text x="480" y="215" text-anchor="middle" class="small">Battery monitor</text>
  <text x="480" y="240" text-anchor="middle" class="small">Button input</text>
  <text x="480" y="265" text-anchor="middle" class="small">Telemetry</text>

  <rect x="670" y="110" width="250" height="180" rx="18" class="box"/>
  <text x="795" y="155" text-anchor="middle" class="label">Raspberry Pi 5</text>
  <text x="795" y="190" text-anchor="middle" class="small">Gesture recognition</text>
  <text x="795" y="215" text-anchor="middle" class="small">Depth + SLAM</text>
  <text x="795" y="240" text-anchor="middle" class="small">Environment mapping</text>
  <text x="795" y="265" text-anchor="middle" class="small">Floating 3D windows</text>

  <rect x="470" y="420" width="260" height="170" rx="18" class="box"/>
  <text x="600" y="465" text-anchor="middle" class="label">Spatial Interaction</text>
  <text x="600" y="500" text-anchor="middle" class="small">Focus tracking</text>
  <text x="600" y="525" text-anchor="middle" class="small">Aim assist</text>
  <text x="600" y="550" text-anchor="middle" class="small">3D UI anchors</text>
  <text x="600" y="575" text-anchor="middle" class="small">Room-aware actions</text>

  <path d="M290 200 L375 200" class="line"/>
  <path d="M585 200 L670 200" class="line"/>
  <path d="M795 290 L795 360" class="line"/>
  <path d="M795 360 L600 360" class="line"/>
  <path d="M600 360 L600 420" class="line"/>

  <text x="312" y="180" class="small">signals</text>
  <text x="610" y="180" class="small">compute</text>
  <text x="820" y="330" class="small">results</text>
  <text x="620" y="390" class="small">interaction loop</text>

</svg>
