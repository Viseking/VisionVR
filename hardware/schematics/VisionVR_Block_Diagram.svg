<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VisionVR Hardware Block Diagram</title>
  <desc id="desc">A conceptual hardware block diagram showing the VisionVR headset's battery, power path, compute, display, sensors, connectivity, and audio interface.</desc>

  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .power { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .compute { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .sensor { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .display { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .connect { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .wire { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .wireThin { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="680" rx="18" class="panel"/>
  <text x="600" y="62" text-anchor="middle" class="title">VisionVR Hardware Architecture</text>

  <!-- Battery and power -->
  <rect x="70" y="120" width="180" height="120" rx="12" class="power"/>
  <text x="160" y="165" text-anchor="middle" class="label">Battery Pack</text>
  <text x="160" y="190" text-anchor="middle" class="small">3.7V Li-Ion / 4S</text>
  <text x="160" y="210" text-anchor="middle" class="small">Protection + BMS</text>

  <rect x="330" y="120" width="180" height="120" rx="12" class="power"/>
  <text x="420" y="165" text-anchor="middle" class="label">Power Mgmt.</text>
  <text x="420" y="190" text-anchor="middle" class="small">PMIC / Buck-Boost</text>
  <text x="420" y="210" text-anchor="middle" class="small">1.8V, 3.3V, 5V</text>

  <path d="M250 180 L330 180" class="wire"/>
  <path d="M510 180 L590 180" class="wire"/>

  <!-- Compute -->
  <rect x="590" y="120" width="200" height="160" rx="12" class="compute"/>
  <text x="690" y="165" text-anchor="middle" class="label">Main Compute</text>
  <text x="690" y="190" text-anchor="middle" class="small">SoC / MCU</text>
  <text x="690" y="210" text-anchor="middle" class="small">DSP + Vision Pipeline</text>
  <text x="690" y="235" text-anchor="middle" class="small">Memory + Storage</text>

  <!-- Display -->
  <rect x="860" y="120" width="220" height="140" rx="12" class="display"/>
  <text x="970" y="165" text-anchor="middle" class="label">Display Path</text>
  <text x="970" y="190" text-anchor="middle" class="small">High-res micro-OLED</text>
  <text x="970" y="210" text-anchor="middle" class="small">Display Driver + LVDS</text>
  <text x="970" y="230" text-anchor="middle" class="small">Backlight / Touch</text>

  <path d="M790 190 L860 190" class="wire"/>

  <!-- Sensor block -->
  <rect x="130" y="330" width="220" height="200" rx="12" class="sensor"/>
  <text x="240" y="370" text-anchor="middle" class="label">Tracking Sensors</text>
  <text x="240" y="400" text-anchor="middle" class="small">IMU</text>
  <text x="240" y="425" text-anchor="middle" class="small">Stereo cameras</text>
  <text x="240" y="450" text-anchor="middle" class="small">Time-of-flight / depth</text>
  <text x="240" y="475" text-anchor="middle" class="small">IR LEDs + optics</text>
  <text x="240" y="500" text-anchor="middle" class="small">Environment sensors</text>

  <rect x="430" y="330" width="220" height="200" rx="12" class="sensor"/>
  <text x="540" y="370" text-anchor="middle" class="label">Audio + Haptics</text>
  <text x="540" y="400" text-anchor="middle" class="small">Speaker / amp</text>
  <text x="540" y="425" text-anchor="middle" class="small">Microphones</text>
  <text x="540" y="450" text-anchor="middle" class="small">Vibration motors</text>
  <text x="540" y="475" text-anchor="middle" class="small">IMU / touch pads</text>

  <rect x="730" y="330" width="220" height="200" rx="12" class="connect"/>
  <text x="840" y="370" text-anchor="middle" class="label">Wireless + IO</text>
  <text x="840" y="400" text-anchor="middle" class="small">Wi-Fi / BT</text>
  <text x="840" y="425" text-anchor="middle" class="small">USB-C / charging</text>
  <text x="840" y="450" text-anchor="middle" class="small">GPIO / debug</text>
  <text x="840" y="475" text-anchor="middle" class="small">External accessory port</text>

  <!-- interconnects -->
  <path d="M350 430 L430 430" class="wire"/>
  <path d="M650 430 L730 430" class="wire"/>
  <path d="M690 280 L690 330" class="wire"/>
  <path d="M240 280 L240 330" class="wire"/>
  <path d="M540 280 L540 330" class="wire"/>
  <path d="M840 280 L840 330" class="wire"/>

  <!-- Power distribution to subsystems -->
  <path d="M420 240 L420 300 L950 300 L950 420" class="wireThin"/>
  <path d="M420 240 L420 300" class="wireThin"/>
  <path d="M420 300 L420 330" class="wireThin"/>

  <!-- Footer labels -->
  <text x="600" y="615" text-anchor="middle" class="small">Conceptual reference only — intended to evolve into a detailed schematic and PCB capture.</text>
</svg>
